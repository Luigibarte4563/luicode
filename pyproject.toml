[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "luicode"
version = "1.0.0"
description = "The local gateway for agentic coding: one proxy and Admin UI across providers and coding agents"
readme = "README.md"
requires-python = ">=3.14.0"
# Repository URLs are placeholders; replace with the real luicode repository
# before publishing. Do not use the existing "luicode" GitHub user namespace.
# [project.urls]
# Homepage = "https://github.com/your-github-org/luicode"
# Repository = "https://github.com/your-github-org/luicode"
# Issues = "https://github.com/your-github-org/luicode/issues"
dependencies = [
    "anyio>=4.15.1",
    "fastapi[standard]>=0.141.1",
    "uvicorn>=0.52.1",
    "httpx[socks]>=0.28.1",
    "httpx2[socks]>=2.7.0,<3",
    "markdown-it-py>=4.2.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.2",
    "tiktoken>=0.13.0",
    "python-telegram-bot>=22.8",
    "discord.py>=2.7.1",
    "openai>=3.14.0",
    "loguru>=0.7.0",
    "aiohttp>=3.14.3",
    "jsonschema>=4.25.0",
    "json5>=0.15.0",
    "tomlkit>=0.13.3",
    "google-auth[requests]>=2.56.3",
    "requests[socks]>=2.34.2",
    "pystray>=0.19.5; sys_platform == 'win32' or sys_platform == 'darwin'",
    "Pillow>=12.0.0; sys_platform == 'win32' or sys_platform == 'darwin'",
    "github-copilot-sdk==1.0.13",
    "simplejson>=4.1.2",
]

[project.scripts]
luicode-server = "luicode.cli.entrypoints:serve"
luicode-claude = "luicode.cli.launchers.claude:launch"
luicode-codex = "luicode.cli.launchers.codex:launch"
luicode-pi = "luicode.cli.launchers.pi:launch"
luicode-opencode = "luicode.cli.launchers.opencode:launch"
luicode-cline = "luicode.cli.launchers.cline:launch"
luicode-hermes = "luicode.cli.launchers.hermes:launch"
luicode-dsh = "luicode.cli.launchers.dsh:launch"
luicode-grok = "luicode.cli.launchers.grok:launch"
luicode-muse = "luicode.cli.launchers.muse:launch"
luicode-aider = "luicode.cli.launchers.aider:launch"

[project.gui-scripts]
luicode-desktop = "luicode.cli.desktop_entrypoint:launch"

[project.optional-dependencies]
voice = [
    "grpcio>=1.83.1",
    "grpcio-tools>=1.81.1",
    "nvidia-riva-client>=2.26.0",
]
voice_local = [
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "accelerate>=1.15.0",
    "librosa>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/luicode"]

[tool.hatch.build.targets.wheel.shared-scripts]
"scripts/update/luicode-update" = "luicode-update"
"scripts/update/luicode-update.cmd" = "luicode-update.cmd"

[tool.uv]
required-version = ">=0.12.13"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ty>=0.0.80",
    "ruff>=0.16.7",
    "pytest-xdist>=3.8.0",
    "pytest-playwright>=0.9.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes (undefined names, unused imports)
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (modernise syntax for target Python version)
    "B",    # flake8-bugbear (common bugs and anti-patterns)
    "C4",   # flake8-comprehensions (idiomatic comprehensions)
    "SIM",  # flake8-simplify (simplifiable code patterns)
    "PERF", # Perflint (performance anti-patterns)
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",  # line too long — enforced by the formatter instead
    "B008",  # FastAPI Depends() in argument defaults is intentional
    "RUF006",  # fire-and-forget tasks intentionally not awaited
]

[tool.ruff.lint.isort]
known-first-party = ["luicode", "smoke"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-n auto"
filterwarnings = [
    "error",
    # Starlette's test client uses this deprecated alias, including in 1.6.0.
    'ignore:^The anyio\.abc\.BlockingPortal alias is deprecated, use anyio\.from_thread\.BlockingPortal instead\.$:DeprecationWarning:^starlette\.testclient$',
]
testpaths = ["tests"]
markers = [
    "live: opt-in local smoke tests that can touch real services",
    "interactive: smoke tests requiring manual user interaction",
    "provider: live provider checks",
    "messaging: live messaging platform checks",
    "cli: CLI integration checks",
    "clients: client compatibility checks",
    "voice: voice transcription checks",
    "contract: deterministic feature contract checks",
    "smoke_target(name): route a smoke test behind LUICODE_SMOKE_TARGETS",
    "xdist_group(name): group smoke provider items under pytest-xdist --dist=loadgroup",
]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.analysis]
# Optional voice_local extra: torch, transformers, librosa for local whisper transcription
# Optional voice extra: nvidia-riva-client for nvidia_nim transcription provider
allowed-unresolved-imports = [
    "torch",
    "transformers",
    "librosa",
    "riva.client",
    "pystray",
    "PIL",
]
